<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>kings-works</title>
<style>
:root{--bg:#0d1013;--fg:#e8e6e1;--dim:#8f9096;--line:#22272c;--accent:#cbb994}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
 font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
 line-height:1.9;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:72px 24px 96px}
h1{font-size:28px;letter-spacing:.14em;font-weight:500;margin:0 0 4px}
.sub{color:var(--accent);letter-spacing:.3em;font-size:12px;margin:0 0 56px}
h2{font-size:15px;letter-spacing:.18em;font-weight:500;color:var(--accent);
 margin:56px 0 16px;padding-bottom:8px;border-bottom:1px solid var(--line)}
p{margin:0 0 18px}
ul{padding-left:1.2em;margin:0 0 18px}
li{margin-bottom:6px}
a{color:var(--fg);text-decoration:none;border-bottom:1px solid var(--accent)}
a:hover{color:var(--accent)}
footer{margin-top:80px;padding-top:24px;border-top:1px solid var(--line);
 color:var(--dim);font-size:13px}
@media (max-width:480px){.wrap{padding:48px 20px 72px}h1{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
<h1>kings-works</h1>
<p class="sub">static pages</p>

<p>プロジェクトごとの静的ページを置いている場所です。</p>

<h2>プロジェクト</h2>
<ul>
<li><a href="soundpedia/">Soundpedia</a> — 音の図鑑（<a href="https://www.youtube.com/@sound_pedia">@sound_pedia</a>）</li>
</ul>
</div>
</body>
</html>
